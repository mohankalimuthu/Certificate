<!-- dashboard.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">
</head>
<body>


    <div class="dashboard-container">

        <div class="dashboard-card">

            <h1>Certificate Dashboard</h1>
            <p>Generate Internship Certificate</p>

            <form id="certificateForm">

                <div class="input-group">
                    <label>Candidate Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter Candidate Name"
                        required
                    >
                </div>
<div class="input-group">

    <label>Domain</label>

    <select id="domain" required>

        <option value="">
            Select Domain
        </option>

        <option value="Python">
            Python
        </option>

        <option value="Java">
            Java
        </option>

        <option value="Machine Learning">
            Machine Learning
        </option>

    </select>

</div>

                <div class="input-group">

    <label>Mark</label>

    <select id="mark" required>

        <option value="">
            Select Mark
        </option>

        <option value="30">30</option>
        <option value="29">29</option>
        <option value="28">28</option>
        <option value="27">27</option>
        <option value="26">26</option>
        <option value="25">25</option>
        <option value="24">24</option>
        <option value="23">23</option>
        <option value="22">22</option>
        <option value="21">21</option>
        <option value="20">20</option>
        <option value="19">19</option>
        <option value="18">18</option>
        <option value="17">17</option>
        <option value="16">16</option>
        <option value="15">15</option>
        <option value="14">14</option>
        <option value="13">13</option>
        <option value="12">12</option>
        <option value="11">11</option>
        <option value="10">10</option>
        <option value="9">9</option>
        <option value="8">8</option>
        <option value="7">7</option>
        <option value="6">6</option>
        <option value="5">5</option>
        <option value="4">4</option>
        <option value="3">3</option>
        <option value="2">2</option>
        <option value="1">1</option>
        <option value="0">0</option>

    </select>

</div>

                <div class="input-group">

    <label>Domain Code</label>

    <select id="domain_code" required>

        <option value="">
            Select Domain Code
        </option>

        <option value="PY">
            Python - PY
        </option>

        <option value="JV">
            Java - JV
        </option>

        <option value="WD">
            Web Development - WD
        </option>

        <option value="ML">
            Machine Learning - ML
        </option>

        <option value="AI">
            Artificial Intelligence - AI
        </option>

        <option value="GA">
            Gen AI - GA
        </option>

    </select>

</div>
                <div class="input-group">
    <label>Batch</label>

    <select id="batch" required>
        <option value="">Select Batch</option>

        <option value="B1">B1</option>
        <option value="B2">B2</option>
        <option value="B3">B3</option>
        <option value="B4">B4</option>
        <option value="B5">B5</option>
        <option value="B6">B6</option>
        <option value="B7">B7</option>
        <option value="B8">B8</option>
        <option value="B9">B9</option>
        <option value="B10">B10</option>
        <option value="B11">B11</option>
        <option value="B12">B12</option>
        <option value="B13">B13</option>
        <option value="B14">B14</option>
        <option value="B15">B15</option>
        <option value="B16">B16</option>
        <option value="B17">B17</option>
        <option value="B18">B18</option>
        <option value="B19">B19</option>
        <option value="B20">B20</option>
    </select>
</div>

                <div class="input-group">
                    <label>Group</label>
                    <input
                        type="text"
                        id="group"
                        placeholder="Enter Group"
                        required
                    >
                </div>

                <button type="submit">
                    Generate Certificate
                </button>

            </form>



            <div id="result"></div>

        </div>

    </div>

    <script src="dashboard.js"></script>

</body>
</html>
